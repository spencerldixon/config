---
# macOS hardening, based on https://github.com/drduh/OS-X-Security-and-Privacy-Guide

- name: Destroy FileVault key on standby + hibernate to disk
  become: true
  ansible.builtin.command: "{{ item }}"
  loop:
    - pmset -a destroyfvkeyonstandby 1
    - pmset -a hibernatemode 25
  changed_when: true

- name: Check FileVault status
  ansible.builtin.command: fdesetup status
  register: filevault_status
  changed_when: false

- name: Warn if FileVault is off
  ansible.builtin.debug:
    msg: "FileVault is OFF. Enable manually (System Settings > Privacy & Security) — not automated, needs a recovery key handled interactively."
  when: "'FileVault is On' not in filevault_status.stdout"

- name: Enable firewall, logging, stealth mode, disallow signed software bypass
  become: true
  community.general.osx_defaults:
    domain: /Library/Preferences/com.apple.alf
    key: "{{ item.key }}"
    type: bool
    value: "{{ item.value }}"
  loop:
    - { key: globalstate, value: true }
    - { key: loggingenabled, value: true }
    - { key: stealthenabled, value: true }
    - { key: allowsignedenabled, value: false }
    - { key: allowdownloadsignedenabled, value: false }

- name: Disable captive portal (avoids MITM via fake wifi login pages)
  become: true
  community.general.osx_defaults:
    domain: /Library/Preferences/SystemConfiguration/com.apple.captive.control
    key: Active
    type: bool
    value: false

- name: Disable guest account
  become: true
  community.general.osx_defaults:
    domain: /Library/Preferences/com.apple.loginwindow
    key: GuestEnabled
    type: bool
    value: false

- name: Require password immediately after sleep/screensaver
  community.general.osx_defaults:
    domain: com.apple.screensaver
    key: "{{ item.key }}"
    type: int
    value: "{{ item.value }}"
  loop:
    - { key: askForPassword, value: 1 }
    - { key: askForPasswordDelay, value: 0 }

- name: Enable Gatekeeper
  become: true
  ansible.builtin.command: spctl --master-enable
  changed_when: true

- name: Disable remote login (SSH)
  become: true
  ansible.builtin.command: systemsetup -setremotelogin off
  changed_when: true

- name: Disable remote Apple events
  become: true
  ansible.builtin.command: systemsetup -setremoteappleevents off
  changed_when: true

- name: Disable Bonjour multicast advertising
  become: true
  community.general.osx_defaults:
    domain: /Library/Preferences/com.apple.mDNSResponder
    key: NoMulticastAdvertisements
    type: bool
    value: true

- name: Enable automatic security updates
  become: true
  community.general.osx_defaults:
    domain: /Library/Preferences/com.apple.SoftwareUpdate
    key: "{{ item }}"
    type: bool
    value: true
  loop:
    - AutomaticCheckEnabled
    - AutomaticDownload
    - AutomaticallyInstallMacOSUpdates
    - ConfigDataInstall
    - CriticalUpdateInstall

- name: Turn on scheduled software update checks
  become: true
  ansible.builtin.command: softwareupdate --schedule on
  changed_when: true

- name: Disable Screen Sharing / Remote Management (ARD)
  become: true
  ansible.builtin.command: /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -deactivate -stop
  changed_when: true

- name: Disable Screen Sharing launchd service
  become: true
  ansible.builtin.command: launchctl disable system/com.apple.screensharing
  changed_when: true

- name: Check for firmwarepasswd binary (Intel Macs only)
  ansible.builtin.stat:
    path: /usr/sbin/firmwarepasswd
  register: firmwarepasswd_bin

- name: Check firmware password status
  become: true
  ansible.builtin.command: /usr/sbin/firmwarepasswd -check
  register: firmware_password_status
  changed_when: false
  when: firmwarepasswd_bin.stat.exists

- name: Warn if firmware password is off (Intel)
  ansible.builtin.debug:
    msg: "Firmware password is OFF. Enable manually with 'sudo firmwarepasswd -setpasswd' — needs interactive password entry."
  when: firmwarepasswd_bin.stat.exists and "'Password Enabled: Yes' not in firmware_password_status.stdout"

- name: Note firmware password equivalent on Apple Silicon
  ansible.builtin.debug:
    msg: "No firmwarepasswd binary (Apple Silicon Mac). Equivalent protection is an Owner/firmware password via Startup Security Utility in recoveryOS (hold power button at boot) — not automatable."
  when: not firmwarepasswd_bin.stat.exists

- name: Enable Secure Keyboard Entry in Terminal.app
  community.general.osx_defaults:
    domain: com.apple.Terminal
    key: SecureKeyboardEntry
    type: bool
    value: true

- name: Disable sending diagnostic & usage data to Apple
  become: true
  ansible.builtin.command: "{{ item }}"
  loop:
    - defaults write /Library/Application\ Support/CrashReporter/DiagnosticMessagesHistory.plist AutoSubmit -bool false
    - defaults write /Library/Application\ Support/CrashReporter/DiagnosticMessagesHistory.plist AutoSubmitVersion -int 4
  changed_when: true

- name: Get active network services
  ansible.builtin.shell: networksetup -listallnetworkservices | tail -n +2 | grep -v '^\*'
  register: network_services
  changed_when: false
  failed_when: network_services.rc not in [0, 1]

- name: Set encrypted-friendly system DNS resolvers (Cloudflare)
  become: true
  ansible.builtin.command: networksetup -setdnsservers "{{ item }}" 1.1.1.1 1.0.0.1
  loop: "{{ network_services.stdout_lines }}"
  changed_when: true
